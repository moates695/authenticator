[project]
name = "authenticator-server"
version = "0.1.0"
description = "Zero-knowledge sync server for the Authenticator app"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "psycopg[binary,pool]>=3.2",
    # Runtime, not just tests: verification codes go out over the Gmail API,
    # because the droplet's provider blocks every outbound SMTP port. See mail.py.
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `tests/` is not a package, so pytest would otherwise not have the project root
# on sys.path and `import app` would fail.
pythonpath = ["."]
