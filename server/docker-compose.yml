# Named explicitly. The default would be taken from the directory, which is just
# `server` — generic enough to collide with another project on the same host, and
# a collision here means `docker compose down` reaching containers that are not
# ours.
name: authenticator

services:
  authenticator:
    build: .
    image: authenticator-server:latest
    container_name: authenticator-prod
    restart: unless-stopped
    # One secret now, in .env and inside DATABASE_URL: the password of the
    # `authenticator` role on the droplet's own Postgres. It cannot decrypt
    # anything — the server holds no key that can — but it is no longer merely
    # tuning, so .env has to be treated as something worth protecting.
    env_file: .env
    # The database is the PostgreSQL installed on the droplet, not a container.
    # `host-gateway` is the address of the box itself as seen from this network,
    # which is how every other app here reaches that install — dates-prod,
    # watts-api and moates-stats-prod all carry the same line. Matching them
    # matters more than the alternative did: the box already listens on `*` and
    # already has a `host all all 172.16.0.0/12 md5` rule covering the docker
    # networks, so this needs nothing added to postgresql.conf or pg_hba.conf.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # There is no `depends_on` to have any more: the database is started by
    # systemd, not by compose. On a reboot the container can therefore come up
    # first and fail its startup connect — `restart: unless-stopped` is what
    # settles that, within a few seconds, rather than an ordering rule compose is
    # not in a position to enforce.
    # The droplet runs several containers on 2GB. A ceiling here means a runaway
    # request cannot take the other sites down with it.
    mem_limit: 256m
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # No published ports: nginx-proxy-prod reaches this container by name over the
    # shared network below, so the service is never exposed directly.
    networks: [ proxy-net ]

networks:
  # Created by the gym_junkie_server compose project and already carrying
  # nginx-proxy-prod and vaultwarden. Declared external so we join it rather than
  # creating a second network.
  proxy-net:
    external: true
    name: backend-prod_api-network
