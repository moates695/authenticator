# >>> authenticator vhost >>>  (managed block — deploy/install_nginx_vhost.py replaces everything between these markers)
# Authenticator sync vhost for the existing nginx-proxy-prod.
#
# Follows the vault.moates.com.au block exactly: wildcard Cloudflare Origin cert,
# request-time upstream resolution so nginx still starts when this container is
# down, real client IP recovered from Cloudflare, and an origin lock so the
# droplet's raw IP cannot be used to bypass the edge.
#
# As documented on the vault block, an iptables fail2ban jail cannot ban HTTP
# offenders here — the service is Dockerised (published ports are DNAT'd past the
# INPUT chain) and Cloudflare-proxied (the packet source is the CF edge). The
# controls that do work are the nginx rate limits below, keyed on the real client
# IP, the origin lock, and optionally a Cloudflare rate-limit rule.

# Shared memory is allocated up front, and the droplet has little to spare. 1m
# tracks on the order of ten thousand addresses per zone, far more than this
# service will ever see at once.
#
# /v1/login is the entire brute-force surface, so it gets the tightest limit.
limit_req_zone $binary_remote_addr zone=auth_login:1m rate=10r/m;
# Registration is open, so throttle it hard enough that mass signups are pointless.
limit_req_zone $binary_remote_addr zone=auth_register:1m rate=2r/m;
# Everything else. Generous — a device syncing normally makes a few requests a day.
limit_req_zone $binary_remote_addr zone=auth_general:1m rate=120r/m;

# --- Origin lock: only allow requests that actually arrived via Cloudflare. ---
# Evaluated against $realip_remote_addr, i.e. the ORIGINAL TCP peer (the CF edge)
# BEFORE the real_ip module rewrites $remote_addr to the visitor.
# (Ranges snapshot 2026-07-22; keep in sync with the vault block and with
# set_real_ip_from below.)
geo $realip_remote_addr $authenticator_from_cloudflare {
	default 0;
	173.245.48.0/20 1;
	103.21.244.0/22 1;
	103.22.200.0/22 1;
	103.31.4.0/22 1;
	141.101.64.0/18 1;
	108.162.192.0/18 1;
	190.93.240.0/20 1;
	188.114.96.0/20 1;
	197.234.240.0/22 1;
	198.41.128.0/17 1;
	162.158.0.0/15 1;
	104.16.0.0/13 1;
	104.24.0.0/14 1;
	172.64.0.0/13 1;
	131.0.72.0/22 1;
	2400:cb00::/32 1;
	2606:4700::/32 1;
	2803:f800::/32 1;
	2405:b500::/32 1;
	2405:8100::/32 1;
	2a06:98c0::/29 1;
	2c0f:f248::/32 1;
}

# Redirect HTTP -> HTTPS
server {
	listen 80;
	server_name authenticator.moates.com.au;
	return 301 https://$server_name$request_uri;
}

server {
	listen 443 ssl http2;
	server_name authenticator.moates.com.au;

	# Origin lock: reject anything that did not come through Cloudflare.
	if ($authenticator_from_cloudflare = 0) { return 403; }

	# Wildcard *.moates.com.au origin certificate, already mounted for the siblings.
	ssl_certificate /etc/nginx/ssl/cloudflare-cert.pem;
	ssl_certificate_key /etc/nginx/ssl/cloudflare-key.pem;
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_ciphers HIGH:!aNULL:!MD5;
	ssl_prefer_server_ciphers on;

	add_header X-Frame-Options "DENY" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
	# There is no browser client, so nothing should ever be framed or referred.
	add_header Referrer-Policy "no-referrer" always;

	# A 1MiB vault blob base64-expands inside a JSON body; 2m leaves headroom and
	# still rejects anything absurd before it reaches the application.
	client_max_body_size 2m;

	set_real_ip_from 173.245.48.0/20;
	set_real_ip_from 103.21.244.0/22;
	set_real_ip_from 103.22.200.0/22;
	set_real_ip_from 103.31.4.0/22;
	set_real_ip_from 141.101.64.0/18;
	set_real_ip_from 108.162.192.0/18;
	set_real_ip_from 190.93.240.0/20;
	set_real_ip_from 188.114.96.0/20;
	set_real_ip_from 197.234.240.0/22;
	set_real_ip_from 198.41.128.0/17;
	set_real_ip_from 162.158.0.0/15;
	set_real_ip_from 104.16.0.0/13;
	set_real_ip_from 104.24.0.0/14;
	set_real_ip_from 172.64.0.0/13;
	set_real_ip_from 131.0.72.0/22;
	set_real_ip_from 2400:cb00::/32;
	set_real_ip_from 2606:4700::/32;
	set_real_ip_from 2803:f800::/32;
	set_real_ip_from 2405:b500::/32;
	set_real_ip_from 2405:8100::/32;
	set_real_ip_from 2a06:98c0::/29;
	set_real_ip_from 2c0f:f248::/32;
	real_ip_header CF-Connecting-IP;

	# Resolve the upstream at request time via Docker's embedded DNS so nginx
	# still starts (and the other sites stay up) even if this container is down.
	resolver 127.0.0.11 valid=30s;
	set $auth_upstream http://authenticator-prod:8000;

	proxy_http_version 1.1;
	proxy_set_header Host $host;
	# The application reads this to key its own throttles on the real visitor.
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_read_timeout 30s;

	location = /v1/login {
	    limit_req zone=auth_login burst=5 nodelay;
	    limit_req_status 429;
	    proxy_pass $auth_upstream;
	}

	location = /v1/register {
	    limit_req zone=auth_register burst=2 nodelay;
	    limit_req_status 429;
	    proxy_pass $auth_upstream;
	}

	location / {
	    limit_req zone=auth_general burst=60 nodelay;
	    limit_req_status 429;
	    proxy_pass $auth_upstream;
	}
}
# <<< authenticator vhost <<<
